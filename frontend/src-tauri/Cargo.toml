[package]
name = "local-model-router"
version = "0.2.1"
description = "Local Model Router desktop app"
authors = ["Local Model Router"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

serde = { version = "1", features = ["derive"] }
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
